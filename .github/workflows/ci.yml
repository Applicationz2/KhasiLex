name: KhasiLex CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api linguistics scripts tests

      - name: Validate lexicon
        run: python scripts/validate.py

      - name: Validate v1 verification pilot
        run: python scripts/validate_v1_pilot.py

      - name: Build and audit corpus
        run: python scripts/build_all.py

      - name: Validate candidate staging interface
        run: python scripts/stage_candidates.py data/pending/import_template.csv --output /tmp/khasilex-staged.jsonl

      - name: Run tests
        run: pytest -q -p no:cacheprovider

      - name: Upload corpus quality report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: khasilex-corpus-report
          path: quality/corpus_report.json
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container
        run: docker build -t khasilex:ci .
