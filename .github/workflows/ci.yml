name: KhasiLex CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api linguistics scripts tests

      - name: Validate lexicon
        run: python scripts/validate.py

      - name: Build and audit corpus
        run: python scripts/build_all.py

      - name: Validate candidate staging interface
        run: python scripts/stage_candidates.py data/pending/import_template.csv --output /tmp/khasilex-staged.jsonl

      - name: Run tests
        run: pytest -q -p no:cacheprovider

      - name: Upload corpus quality report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: khasilex-corpus-report
          path: quality/corpus_report.json
          if-no-files-found: error

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t khasilex:ci .
